services:
  # ===== MySQL — DB mới multidb_v2 =====
  mysql:
    image: mysql:8.0
    container_name: multi-mysql-v2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_multimedia_2026
      MYSQL_DATABASE: ${DB_NAME:-multidb_v2}
      MYSQL_USER: ${DB_USERNAME:-multi_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-multimedia_2026}
    ports:
      - "3306:3306"
    volumes:
      - mysql_v2_data:/var/lib/mysql
      # Mount DB legacy để chạy 2 DB song song (import data): bỏ comment nếu cần
      # - ./legacy/multidb.sql:/docker-entrypoint-initdb.d/multidb.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_multimedia_2026"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - multi-network

  # ===== Redis — BullMQ queue =====
  redis:
    image: redis:7-alpine
    container_name: multi-redis-v2
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - multi-network

  # ===== MinIO — S3 storage cho upload (dev) =====
  minio:
    image: minio/minio:latest
    container_name: multi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin123}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console (user/pass = env trên)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - multi-network

  # Tạo bucket + mở anonymous read (để publicUrl serve được ảnh) — chạy 1 lần rồi thoát
  minio-init:
    image: minio/mc:latest
    container_name: multi-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY_ID:-minioadmin} $${S3_SECRET_ACCESS_KEY:-minioadmin123}
      && mc mb --ignore-existing local/$${S3_BUCKET:-multi-uploads}
      && mc anonymous set download local/$${S3_BUCKET:-multi-uploads}
      "
    networks:
      - multi-network

  # ===== API =====
  api:
    build: .
    container_name: multi-api-v2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
      - DATABASE_URL=mysql://${DB_USERNAME:-multi_user}:${DB_PASSWORD:-multimedia_2026}@mysql:3306/${DB_NAME:-multidb_v2}
      # MinIO: endpoint nội bộ cho server, presign/public URL dùng host publish ra client
      - S3_ENDPOINT=http://minio:9000
      - S3_PRESIGN_ENDPOINT=http://localhost:9000
      - S3_PUBLIC_URL=http://localhost:9000/${S3_BUCKET:-multi-uploads}
      - S3_BUCKET=${S3_BUCKET:-multi-uploads}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin123}
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - multi-network

volumes:
  mysql_v2_data:
  minio_data:

networks:
  multi-network:
    driver: bridge
